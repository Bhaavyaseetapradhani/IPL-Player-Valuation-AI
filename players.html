<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPL ValueAI — Advanced Analytics Roster</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="assets/js/components.js"></script>
</head>
<body class="flex flex-col min-h-full pt-16">

    <div data-component="header" data-active-page="players"></div>

    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-12">
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-6 mb-8 pb-6 border-b border-slate-800/60">
            <div>
                <h1 class="text-3xl font-bold text-white tracking-tight">Player Valuation Matrix</h1>
                <p class="text-sm text-slate-400 mt-1">Audit predictive market data logs alongside computed delta profiles.</p>
            </div>
            
            <!-- Real-time Interface Query Inputs Controls -->
            <div class="flex flex-wrap gap-3 items-center">
                <div class="relative w-full sm:w-64">
                    <i data-lucide="search" class="w-4 h-4 text-slate-500 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
                    <input type="text" id="search-input" placeholder="Query player profiles..." class="w-full bg-slate-900 border border-slate-800 rounded-xl pl-10 pr-4 py-2 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500 transition-colors">
                </div>
                <select id="role-filter" class="bg-slate-900 border border-slate-800 rounded-xl px-4 py-2 text-sm text-slate-300 focus:outline-none focus:border-emerald-500 transition-colors">
                    <option value="ALL">All Roles</option>
                    <option value="Batsman">Batsmen</option>
                    <option value="Bowler">Bowlers</option>
                    <option value="All-Rounder">All-Rounders</option>
                </select>
            </div>
        </div>

        <!-- Render Target Roster Anchor Node -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="roster-grid-mount">
            <!-- Programmatic JavaScript Injection Target -->
        </div>
    </main>

    <div data-component="footer"></div>

    <script>
        let playersCache = [];

        async function initRosterPipeline() {
            try {
                const response = await fetch('assets/data/players.json');
                playersCache = await response.json();
                renderMatrixGrid(playersCache);
            } catch (error) {
                console.error("Critical roster initialization fault:", error);
            }
        }

        function renderMatrixGrid(data) {
            const container = document.getElementById("roster-grid-mount");
            container.innerHTML = data.map(p => {
                const statusColor = p.value_gap_lakhs >= 0 ? 'text-emerald-400 bg-emerald-500/10' : 'text-rose-400 bg-rose-500/10';
                return `
                    <div class="bg-slate-900/40 border border-slate-800/80 rounded-xl p-6 transition-all hover:border-slate-700/60">
                        <div class="flex items-start justify-between mb-4">
                            <div>
                                <h3 class="text-lg font-bold text-white">${p.name}</h3>
                                <span class="text-xs font-mono text-slate-500">${p.team} · ${p.role}</span>
                            </div>
                            <span class="text-xs font-semibold px-2.5 py-1 rounded-full ${statusColor}">
                                ${p.value_gap_pct >= 0 ? '+' : ''}${p.value_gap_pct}% Delta
                            </span>
                        </div>
                        <div class="space-y-2 font-mono text-xs text-slate-400 border-t border-b border-slate-800/50 py-3 my-4">
                            <div class="flex justify-between"><span>Actual Price</span><span class="text-white">₹${(p.actual_price_lakhs / 100).toFixed(2)} Cr</span></div>
                            <div class="flex justify-between"><span>Model Price</span><span class="text-emerald-400">₹${(p.predicted_price_lakhs / 100).toFixed(2)} Cr</span></div>
                        </div>
                        <div class="grid grid-cols-3 gap-2 text-center text-xs font-mono">
                            <div class="bg-slate-950 p-2 rounded-lg"><span class="block text-slate-500 text-[10px]">MATCHES</span><strong class="text-white">${p.matches}</strong></div>
                            <div class="bg-slate-950 p-2 rounded-lg"><span class="block text-slate-500 text-[10px]">S/R</span><strong class="text-white">${p.stats.strike_rate || '-'}</strong></div>
                            <div class="bg-slate-950 p-2 rounded-lg"><span class="block text-slate-500 text-[10px]">ECON</span><strong class="text-white">${p.stats.economy || '-'}</strong></div>
                        </div>
                    </div>
                `;
            }).join("");
            if (typeof lucide !== 'undefined') lucide.createIcons();
        }

        // Setup real-time event filtering listeners
        document.getElementById("search-input").addEventListener("input", executeFilterPipeline);
        document.getElementById("role-filter").addEventListener("change", executeFilterPipeline);

        function executeFilterPipeline() {
            const query = document.getElementById("search-input").value.toLowerCase();
            const role = document.getElementById("role-filter").value;
            
            const filtered = playersCache.filter(p => {
                const matchesSearch = p.name.toLowerCase().includes(query);
                const matchesRole = role === "ALL" || p.role === role;
                return matchesSearch && matchesRole;
            });
            renderMatrixGrid(filtered);
        }

        document.addEventListener("DOMContentLoaded", initRosterPipeline);
    </script>
</body>
</html>
