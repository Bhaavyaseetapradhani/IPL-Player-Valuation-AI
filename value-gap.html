<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPL ValueAI — Market Variance Audit</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="assets/js/components.js"></script>
</head>
<body class="flex flex-col min-h-full pt-16">

    <div data-component="header" data-active-page="value-gap"></div>

    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-12">
        <div class="mb-8">
            <h1 class="text-3xl font-bold text-white tracking-tight">Market Valuation Discrepancies</h1>
            <p class="text-sm text-slate-400 mt-1">Identifies mispriced assets by isolating the delta between historical franchise auction costs and actual model values.</p>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <!-- Undervalued (High ROI Value Options) Section -->
            <div class="bg-slate-900/30 border border-slate-800/80 rounded-xl p-6">
                <h2 class="text-lg font-bold text-emerald-400 flex items-center gap-2 mb-4">
                    <i data-lucide="arrow-up-right" class="w-5 h-5"></i> Top Model Underpriced Assets (Value Targets)
                </h2>
                <div class="space-y-3" id="undervalued-mount"></div>
            </div>

            <!-- Overvalued (Premium Risk Allocations) Section -->
            <div class="bg-slate-900/30 border border-slate-800/80 rounded-xl p-6">
                <h2 class="text-lg font-bold text-rose-400 flex items-center gap-2 mb-4">
                    <i data-lucide="arrow-down-left" class="w-5 h-5"></i> Top Model Overpriced Assets (Market Premiums)
                </h2>
                <div class="space-y-3" id="overvalued-mount"></div>
            </div>
        </div>
    </main>

    <div data-component="footer"></div>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            try {
                const response = await fetch('assets/data/players.json');
                const players = await response.json();
                
                // Sort collections explicitly by variance metric values
                const sorted = [...players].sort((a, b) => b.value_gap_lakhs - a.value_gap_lakhs);
                
                const undervalued = sorted.filter(p => p.value_gap_lakhs > 0).slice(0, 5);
                const overvalued = sorted.filter(p => p.value_gap_lakhs < 0).reverse().slice(0, 5);

                const mapper = p => `
                    <div class="bg-slate-950 border border-slate-800/50 rounded-xl p-4 flex justify-between items-center">
                        <div>
                            <h4 class="text-sm font-bold text-white">${p.name}</h4>
                            <p class="text-xs font-mono text-slate-500">${p.role} · ${p.team}</p>
                        </div>
                        <div class="text-right font-mono text-xs">
                            <span class="block font-bold ${p.value_gap_lakhs >= 0 ? 'text-emerald-400' : 'text-rose-400'}">
                                ${p.value_gap_lakhs >= 0 ? 'Undervalued' : 'Overvalued'}
                            </span>
                            <span class="text-slate-400">₹${Math.abs(p.value_gap_lakhs / 100).toFixed(2)} Cr Gap</span>
                        </div>
                    </div>
                `;

                document.getElementById("undervalued-mount").innerHTML = undervalued.map(mapper).join("");
                document.getElementById("overvalued-mount").innerHTML = overvalued.map(mapper).join("");
                if (typeof lucide !== 'undefined') lucide.createIcons();

            } catch (error) {
                console.error("Critical analytics rendering fault:", error);
            }
        });
    </script>
</body>
</html>
